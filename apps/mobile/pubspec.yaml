name: tav_mobile
description: TAV — Casa de cambio y remesas. App móvil para cajeros y cobradores.
publish_to: 'none'
version: 0.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Navegación
  go_router: ^14.6.2
  # HTTP
  dio: ^5.7.0
  # Almacenamiento seguro de tokens
  flutter_secure_storage: ^11.2.0
  # Formato de moneda es-VE
  intl: ^0.19.0
  # Tipografía Inter
  google_fonts: ^6.2.1
  # Renderizado de SVG (logo)
  flutter_svg: ^2.3.0
  # Abrir marcador y WhatsApp
  url_launcher: ^6.3.0
  # Selección de archivos (capturas de pago: imágenes y PDF)
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_tav.svg
